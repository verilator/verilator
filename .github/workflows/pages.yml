---
# DESCRIPTION: Github actions config
# SPDX-License-Identifier: LGPL-3.0-only OR Artistic-2.0

name: Pages

on:
  push:
    branches: [master]
    paths: ["ci/**", ".github/workflows/**"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Code coverage", "RTLMeter"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these deployments to complete.
# A skipped-upstream run does no work (see the job's if:), so put it in its
# own throwaway group: otherwise, as the newest queued run, it would cancel a
# pending real run and then deploy nothing.
concurrency:
  group: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'skipped') && format('pages-skip-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pages:
    name: Pages
    runs-on: ubuntu-26.04
    # A skipped upstream run (e.g. Code coverage / RTLMeter on a branch push)
    # still fires workflow_run; don't rebuild and redeploy for it.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy-2.outputs.page_url || steps.deploy-1.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Use the Verilator CI app to download the reports and to post the
      # comments. Its rate limit is separate from, and higher than that of the
      # GITHUB_TOKEN, which the hundreds of downloads would otherwise exhaust,
      # failing the deployment that also uses it.
      - name: Generate access token
        id: generate-token
        if: ${{ github.repository == 'verilator/verilator' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.VERILATOR_CI_ID }}
          private-key: ${{ secrets.VERILATOR_CI_KEY }}
          permission-actions: write
          permission-pull-requests: write
      - name: Build pages
        id: build
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
        run: |
          ./ci/ci-pages.bash
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: pages
      # GitHub's Pages backend intermittently fails a deployment mid-sync, retry
      - name: Deploy to GitHub Pages
        id: deploy-1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
      - name: Deploy to GitHub Pages (retry)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
      - name: Comment on PR
        if: ${{ github.repository == 'verilator/verilator' }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          # Slug of the app the above token belongs to, see 'ci-pages-notify.bash'
          GH_AUTHOR: ${{ steps.generate-token.outputs.app-slug }}
          PR_RUN_IDS: ${{ steps.build.outputs.pr-run-ids }}
        run: ./ci/ci-pages-notify.bash
